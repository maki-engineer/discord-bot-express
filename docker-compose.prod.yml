services:
  discord-app:
    build:
      context: ./discord-app
      dockerfile: ./Dockerfile.prod
    container_name: discord-app
    depends_on:
      unittest-db:
        condition: service_healthy
      development-db:
        condition: service_healthy

  unittest-db:
    # postgres:latest はメジャーバージョンが勝手に上がりCIが壊れるためピン留めする
    image: postgres:18
    container_name: postgres-db-unittest
    environment:
      POSTGRES_USER: ${POSTGRES_USER_UNITTEST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_UNITTEST}
      POSTGRES_DB: ${POSTGRES_DB_UNITTEST}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  development-db:
    image: postgres:18
    container_name: postgres-db-development
    environment:
      POSTGRES_USER: ${POSTGRES_USER_DEVELOPMENT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEVELOPMENT}
      POSTGRES_DB: ${POSTGRES_DB_DEVELOPMENT}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  voicevox-engine:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: voicevox_engine
    ports:
      - "50021:50021"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      # 起動直後は initdb 中で接続できないため、healthcheck の完了を待つ
      unittest-db:
        condition: service_healthy
      development-db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      POSTGRES_USER_UNITTEST: ${POSTGRES_USER_UNITTEST}
      POSTGRES_PASSWORD_UNITTEST: ${POSTGRES_PASSWORD_UNITTEST}
      POSTGRES_DB_UNITTEST: ${POSTGRES_DB_UNITTEST}
      POSTGRES_USER_DEVELOPMENT: ${POSTGRES_USER_DEVELOPMENT}
      POSTGRES_PASSWORD_DEVELOPMENT: ${POSTGRES_PASSWORD_DEVELOPMENT}
      POSTGRES_DB_DEVELOPMENT: ${POSTGRES_DB_DEVELOPMENT}
      POSTGRES_URL: ${POSTGRES_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
      TZ: Asia/Tokyo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      WATCHPACK_POLLING: "true"
